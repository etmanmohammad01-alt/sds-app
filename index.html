<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDS Management Platform</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#172033}
.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:white;border-radius:18px;box-shadow:0 8px 30px #0001;padding:24px}
.login .card{width:min(430px,100%)}h1,h2{margin-top:0}.brand{font-size:28px;font-weight:800;margin-bottom:8px;color:#174a7e}
input,select,button{font:inherit;border-radius:10px;padding:11px;border:1px solid #d6deea}input,select{width:100%;background:#fff}
button{cursor:pointer;background:#174a7e;color:white;border:0}.btn2{background:#e9eef5;color:#172033}.danger{background:#b42318}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.stat b{display:block;font-size:28px;margin-top:8px}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#102a43;color:#fff;padding:20px}.side button{display:block;width:100%;text-align:right;margin:8px 0;background:#173d5e}
.main{padding:22px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}
table{width:100%;border-collapse:collapse;background:#fff}.tablewrap{overflow:auto;border-radius:14px}.tablewrap th,.tablewrap td{padding:11px;border-bottom:1px solid #edf1f5;text-align:right;white-space:nowrap}.tablewrap th{background:#f7f9fc}
.toolbar{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}.toolbar input{max-width:320px}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px}.modal .card{width:min(760px,100%);max-height:90vh;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
.badge{padding:5px 9px;border-radius:99px;background:#eef2f7}.ok{background:#dcfce7}.warn{background:#fef3c7}.bad{background:#fee2e2}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div id="login" class="login"><div class="card">
  <div class="brand">🧪 SDS Platform</div><p>منصة إدارة ملفات SDS والمواد الكيميائية</p>
  <input id="user" placeholder="اسم المستخدم" value="admin"><br><br>
  <input id="pass" type="password" placeholder="كلمة المرور" value="admin123"><br><br>
  <button onclick="login()">دخول</button><p id="err" style="color:#b42318"></p>
</div></div>

<div id="app" class="layout hidden">
<aside class="side"><div style="font-size:22px;font-weight:800">🧪 SDS</div><small>Management Platform</small>
<button onclick="show('dashboard')">📊 Dashboard</button>
<button onclick="show('materials')">🧴 المواد الكيميائية</button>
<button onclick="show('audit')">📝 سجل التعديلات</button>
<button onclick="logout()">🚪 خروج</button>
</aside>
<main class="main">
<div class="top"><div><h1 id="title">Dashboard</h1><span id="role"></span></div><button onclick="refresh()">تحديث البيانات</button></div>
<section id="dashboard">
<div class="grid">
<div class="card stat">إجمالي المواد<b id="total">0</b></div>
<div class="card stat">لها SDS<b id="withSds">0</b></div>
<div class="card stat">بدون SDS<b id="missing">0</b></div>
<div class="card stat">تحتاج مراجعة<b id="review">0</b></div>
<div class="card stat">Hazard مرتفع<b id="high">0</b></div>
</div><br>
<div class="card"><h2>المواد حسب القسم</h2><div id="deps"></div></div>
</section>

<section id="materials" class="hidden"><div class="card">
<div class="toolbar"><input id="search" placeholder="ابحث بالاسم أو CAS أو القسم أو المورد..." oninput="loadMaterials()">
<button onclick="openAdd()">+ إضافة مادة</button><button class="btn2" onclick="downloadTemplate()">قالب Excel CSV</button></div>
<div class="tablewrap"><table><thead><tr><th>المادة</th><th>CAS</th><th>القسم</th><th>المورد</th><th>Hazard</th><th>SDS</th><th>إجراء</th></tr></thead>
<tbody id="materialsBody"></tbody></table></div></div></section>

<section id="audit" class="hidden"><div class="card"><div class="tablewrap"><table><thead><tr><th>المستخدم</th><th>الإجراء</th><th>العنصر</th><th>التفاصيل</th><th>التاريخ</th></tr></thead><tbody id="auditBody"></tbody></table></div></div></section>
</main></div>

<div id="modal" class="modal hidden"><div class="card"><h2 id="modalTitle">إضافة مادة</h2>
<form id="materialForm" onsubmit="saveMaterial(event)"><input type="hidden" id="mid">
<div class="formgrid">
<label>اسم المادة<input id="name" required></label><label>الاسم الكيميائي<input id="chemical_name"></label>
<label>CAS Number<input id="cas"></label><label>القسم<input id="department"></label>
<label>المورد<input id="supplier"></label><label>Hazard Score<input id="hazard_score" type="number" min="0" max="10"></label>
<label>SDS Status<select id="sds_status"><option>Missing</option><option>Available</option><option>Review</option></select></label>
<label>تاريخ المراجعة<input id="revision_date" type="date"></label><label>الكمية/التخزين<input id="storage_qty"></label>
</div><br><button>حفظ</button> <button type="button" class="btn2" onclick="closeModal()">إلغاء</button>
</form><hr><div id="uploadBox" class="hidden"><b>رفع ملف SDS PDF</b><br><br><input id="sdsFile" type="file" accept=".pdf"><button onclick="uploadSds()">رفع الملف</button></div>
</div></div>

<script>
let token=localStorage.getItem("sds_token"), currentUser=null;
const $=id=>document.getElementById(id);
async function api(url,opt={}){opt.headers=opt.headers||{};if(token)opt.headers.Authorization="Bearer "+token;
 const r=await fetch(url,opt);if(!r.ok)throw new Error((await r.json()).error||"حدث خطأ");return r.json();}
async function login(){try{const x=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("user").value,password:$("pass").value})});
 token=x.token;currentUser=x.user;localStorage.setItem("sds_token",token);$("login").classList.add("hidden");$("app").classList.remove("hidden");$("role").textContent=x.user.role;refresh();}catch(e){$("err").textContent=e.message}}
function logout(){localStorage.removeItem("sds_token");location.reload()}
async function refresh(){await loadDashboard();await loadMaterials();await loadAudit()}
function show(s){["dashboard","materials","audit"].forEach(x=>$(x).classList.toggle("hidden",x!==s));$("title").textContent=s==="dashboard"?"Dashboard":s==="materials"?"المواد الكيميائية":"سجل التعديلات"}
async function loadDashboard(){try{const d=await api("/api/dashboard");$("total").textContent=d.total;$("withSds").textContent=d.withSds;$("missing").textContent=d.missing;$("review").textContent=d.review;$("high").textContent=d.high;
 $("deps").innerHTML=d.departments.map(x=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><span>${esc(x.department)}</span><b>${x.count}</b></div>`).join("")||"لا توجد بيانات";}catch(e){logout()}}
async function loadMaterials(){if(!token)return;const rows=await api("/api/materials?q="+encodeURIComponent($("search")?.value||""));
 $("materialsBody").innerHTML=rows.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.cas)}</td><td>${esc(m.department)}</td><td>${esc(m.supplier)}</td><td>${m.hazard_score}</td><td><span class="badge ${m.sds_status==="Available"?"ok":m.sds_status==="Review"?"warn":"bad"}">${esc(m.sds_status)}</span></td><td><button onclick='edit(${JSON.stringify(m)})'>تعديل</button> ${currentUser?.role==="Admin"?`<button class="danger" onclick="del(${m.id})">حذف</button>`:""}</td></tr>`).join("")}
async function loadAudit(){if(!token)return;const rows=await api("/api/audit");$("auditBody").innerHTML=rows.map(x=>`<tr><td>${esc(x.username||"-")}</td><td>${esc(x.action)}</td><td>${esc(x.entity)}</td><td>${esc(x.details||"")}</td><td>${esc(x.created_at)}</td></tr>`).join("")}
function openAdd(){ $("modalTitle").textContent="إضافة مادة";$("materialForm").reset();$("mid").value="";$("uploadBox").classList.add("hidden");$("modal").classList.remove("hidden")}
function edit(m){$("modalTitle").textContent="تعديل المادة";["id","name","chemical_name","cas","department","supplier","hazard_score","sds_status","revision_date","storage_qty"].forEach(k=>{if($(k==="id"?"mid":k))$(k==="id"?"mid":k).value=m[k]||""});$("uploadBox").classList.remove("hidden");$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden")}
async function saveMaterial(e){e.preventDefault();const m={name:$("name").value,chemical_name:$("chemical_name").value,cas:$("cas").value,department:$("department").value,supplier:$("supplier").value,hazard_score:$("hazard_score").value,sds_status:$("sds_status").value,revision_date:$("revision_date").value,storage_qty:$("storage_qty").value};const id=$("mid").value;
 await api(id?"/api/materials/"+id:"/api/materials",{method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(m)});closeModal();refresh()}
async function del(id){if(confirm("حذف المادة؟")){await api("/api/materials/"+id,{method:"DELETE"});refresh()}}
async function uploadSds(){const id=$("mid").value,f=$("sdsFile").files[0];if(!id||!f)return alert("اختر مادة وملف PDF");const fd=new FormData();fd.append("file",f);await api("/api/materials/"+id+"/sds",{method:"POST",body:fd});alert("تم رفع SDS");refresh()}
function downloadTemplate(){const csv="name,chemical_name,cas,department,supplier,hazard_score,sds_status,revision_date,storage_qty\\n";const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="SDS_Import_Template.csv";a.click()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
if(token){api("/api/dashboard").then(()=>{$("login").classList.add("hidden");$("app").classList.remove("hidden");refresh()}).catch(()=>logout())}
</script>
</body></html>
